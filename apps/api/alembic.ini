# Alembic configuration.
#
# NOTE: comments in this file are intentionally ASCII-only. Alembic reads the ini
# with the *locale* encoding, so a UTF-8 comment breaks under LC_ALL=C / POSIX locales.
#
# The connection string is NOT stored here (T00 acceptance: shared config and build
# contain no secrets). migrations/env.py reads it from the environment, or from
# `alembic -x db_url=...` which is restricted to test databases.
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os

# Migration filenames carry a date prefix so integration order is visible.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
